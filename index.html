<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazım & Friends | Squad Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bff; /* Mavi/Gökyüzü Neon - Arkadaşlar Rengi */
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.6); /* Buzlu Cam Efekti İçin Yarı Saydam */
            --text: #ffffff;
            --secondary: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden; /* Dairelerin dışarı taşmasını engelle */
            position: relative;
        }

        /* --- SİHİRLİ CANVAS ARKA PLANI --- */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* İçeriğin arkasında kal */
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            z-index: 1; /* Arka planın önünde kal */
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.5); /* Mavi Neon */
        }

        h1 { font-weight: 800; font-size: 24px; margin: 0; letter-spacing: -0.5px; }
        .badge { color: var(--primary); font-size: 14px; font-weight: 600; margin-top: 5px; display: block; }

        .section-title { font-size: 12px; text-transform: uppercase; color: var(--secondary); letter-spacing: 1px; margin: 25px 0 10px 5px; font-weight: 800; }

        /* Glassmorphism (Buzlu Cam) Buton Stili */
        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px); /* Buzlu Cam Efekti */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.2);
        }

        .icon-box { font-size: 20px; margin-right: 15px; }
        
        .link-text b { display: block; font-size: 16px; }
        .link-text span { font-size: 13px; color: var(--secondary); }

        footer { text-align: center; margin-top: 50px; font-size: 12px; color: var(--secondary); line-height: 1.6; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="wrapper">
        <div class="profile">
            <img src="https://via.placeholder.com/150/007bff/fff?text=TAYFA" alt="Squad Logo" class="avatar-img">
            <h1>Tayfa HQ</h1>
            <span class="badge">Afyon'un En Hızlıları</span>
        </div>

        <div class="section-title">Files & Fun</div>
        
        <a href="#" class="link-card">
            <div class="icon-box">📁</div>
            <div class="link-text">
                <b>O Geceki Fotoğraflar</b>
                <span>Son halı saha maçı</span>
            </div>
        </a>

        <a href="#" class="link-card">
            <div class="icon-box">📝</div>
            <div class="link-text">
                <b>Harita Ödevi Verileri</b>
                <span>Sınav öncesi son notlar</span>
            </div>
        </a>

        <footer>
            Squad Base v1.0<br>
            Powered by Hazım (Monster inside)
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        // Daire (Parçacık) Sınıfı
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            // Daireyi çiz
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                // Neon glow efekti (Performansı biraz etkileyebilir)
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
            }
            // Daireyi hareket ettir ve duvarlardan sektir
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        // Parçacık dizisini oluştur
        function init() {
            particlesArray = [];
            // Daire sayısı (Performansa göre ayarla)
            let numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 8) + 2; // Daire boyutu
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                // Hareket hızı (Yavaş ve akışkan)
                let directionX = (Math.random() * 0.4) - 0.2;
                let directionY = (Math.random() * 0.4) - 0.2;
                // Mavi tonları (Gökyüzü mavisi, yarı saydam)
                let color = 'rgba(0, 123, 255, 0.4)';

                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // Animasyon döngüsü
        function animate() {
            requestAnimationFrame(animate);
            // Her karede canvas'ı temizle (Hafif bir iz bırakmak için yarı saydam temizle)
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
        }

        // Pencere boyutu değiştiğinde canvas'ı güncelle
        window.addEventListener('resize', function(){
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
