<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazım | Squad Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bff; 
            --meet-red: #ea4335; /* Google Meet Rengi */
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.6); 
            --text: #ffffff;
            --secondary: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column; 
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: block;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.5);
        }

        h1 { font-weight: 800; font-size: 24px; margin: 0; letter-spacing: -0.5px; }
        .badge { color: var(--primary); font-size: 14px; font-weight: 600; margin-top: 5px; display: block; }

        .section-title { 
            font-size: 12px; 
            text-transform: uppercase; 
            color: var(--secondary); 
            letter-spacing: 1px; 
            margin: 25px 0 10px 5px; 
            font-weight: 800; 
        }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.2);
        }

        /* Meet butonu için özel vurgu */
        .meet-card:hover {
            border-color: var(--meet-red);
            box-shadow: 0 10px 20px rgba(234, 67, 53, 0.3);
        }

        .icon-box { font-size: 20px; margin-right: 15px; display: flex; align-items: center; }
        .link-text b { display: block; font-size: 16px; }
        .link-text span { font-size: 13px; color: var(--secondary); }

        .box-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        footer { text-align: center; margin-top: 50px; font-size: 12px; color: var(--secondary); line-height: 1.6; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="wrapper">
        <!-- Profil -->
        <div class="profile">
            <img src="logo.png" alt="Squad Logo" class="avatar-img">
            <h1>Squad Hub</h1>
            <span class="badge">Provided By Hazım</span>
        </div>

        <!-- Google Meet Bölümü -->
        <div class="section-title">Hızlı Bağlantı</div>
        <a href="https://meet.google.com/zsf-jask-syr" class="link-card meet-card" target="_blank">
            <div class="icon-box">📹</div>
            <div class="link-text">
                <b>Google Meet</b>
                <span>Toplantıya katılmak için tıkla</span>
            </div>
        </a>

        <!-- Discord Bölümü -->
        <div class="section-title">Discord Durumu</div>
        <div class="box-container">
            <iframe src="https://discord.com/widget?id=1488170303787106557&theme=dark" width="100%" height="300" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
        </div>

        <!-- Shoutbox Bölümü -->
        <div class="section-title">Mesaj Kutusu</div>
        <div class="box-container">
            <iframe src="https://www5.cbox.ws/box/?boxid=962200&boxtag=eafgRP" width="100%" height="350" frameborder="0" scrolling="auto"></iframe>
        </div>

        <footer>
            Squad Base v2.0<br>
            Powered by Hazım (Monster inside)
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 8) + 2;
                let x = Math.random() * (innerWidth - size * 2) + size;
                let y = Math.random() * (innerHeight - size * 2) + size;
                let directionX = (Math.random() * 0.4) - 0.2;
                let directionY = (Math.random() * 0.4) - 0.2;
                let color = 'rgba(0, 123, 255, 0.4)';
                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
